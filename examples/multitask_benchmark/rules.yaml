# Multi-task benchmark rules showcasing SEM, rule copying, and separated model groups
groups:
  # Base task configuration
  task_metric:
    higher_is_better: true
    scale: 100
    decimals: 1
    bold: 1
    underline: 2
    # Normalizes sample standard deviation across N=5 seeds into standard error: SEM = std / sqrt(5)
    standard_error_of_mean: 5

  # Supervised task groups
  s_mnli: "task_metric"
  s_qnli: "task_metric"
  s_sst2: "task_metric"
  s_cola: "task_metric"
  s_avg:
    copy_from: "task_metric"
    cell_color_1: "gray!15"
  s_lat:
    higher_is_better: false
    bold: 1
    underline: 2
    decimals: 1
    unit: " ms"

  # Unsupervised task groups copy rules from supervised groups for independent ranking
  us_mnli: "s_mnli"
  us_qnli: "s_qnli"
  us_sst2: "s_sst2"
  us_cola: "s_cola"
  us_avg: "s_avg"
  us_lat: "s_lat"

default:
  decimals: 1
  align_numbers: true
