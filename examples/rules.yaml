# Group rules configuration for LaTeX table generator
groups:
  # ==========================================================
  # Supervised Models Groups
  # ==========================================================
  s_params:
    higher_is_better: false
    bold: 1
    si_prefix: true
    decimals: 1

  s_acc:
    higher_is_better: true
    bold: 1
    underline: 2
    italic: 3
    decimals: 2
    color: "blue"
    cell_color:
      1: "green!15"

  s_top5:
    higher_is_better: true
    bold: 1
    underline: 2
    decimals: 2
    color: "teal"
    cell_color:
      1: "green!15"

  s_f1:
    higher_is_better: true
    bold: 1
    underline: 2
    decimals: 2
    color: "NavyBlue"
    cell_color:
      1: "green!15"

  s_latency:
    higher_is_better: false
    bold: 1
    underline: 2
    decimals: 1
    color: "darkgray"
    cell_color:
      1: "green!15"

  # ==========================================================
  # Unsupervised Models Groups
  # ==========================================================
  us_params:
    higher_is_better: false
    bold: 1
    si_prefix: true
    decimals: 1

  us_acc:
    higher_is_better: true
    bold: 1
    underline: 2
    italic: 3
    decimals: 2
    color: "blue"
    cell_color:
      1: "green!15"

  us_top5:
    higher_is_better: true
    bold: 1
    underline: 2
    decimals: 2
    color: "teal"
    cell_color:
      1: "green!15"

  us_f1:
    higher_is_better: true
    bold: 1
    underline: 2
    decimals: 2
    color: "NavyBlue"
    cell_color:
      1: "green!15"

  us_latency:
    higher_is_better: false
    bold: 1
    underline: 2
    decimals: 1
    color: "darkgray"
    cell_color:
      1: "green!15"

  # ==========================================================
  # Custom / Multi-group Tags
  # ==========================================================
  top_performer:
    cell_color: "yellow!25"
    color: "ForestGreen"

default:
  decimals: 2
