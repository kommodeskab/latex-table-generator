# Group rules configuration for LaTeX table generator
groups:
  # Parameters group: auto-scale with SI prefixes, lower is better (rank 1 = bold)
  params:
    higher_is_better: false
    bold: 1
    si_prefix: true
    decimals: 1

  # Accuracy group: higher is better
  # Rank 1: bold, green background
  # Rank 2: underlined
  # Rank 3: italic
  accuracy:
    higher_is_better: true
    bold: 1
    underline: 2
    italic: 3
    decimals: 2
    color: "blue"
    cell_color:
      1: "green!15"

  # F1-Score group: higher is better, rank 1 is bold with navy text and green cell
  f1:
    higher_is_better: true
    bold: 1
    underline: 2
    decimals: 2
    color: "NavyBlue"
    cell_color:
      1: "green!15"

  # Latency group: lower is better (higher_is_better: false), rank 1 (lowest) is bold with green cell
  latency:
    higher_is_better: false
    bold: 1
    underline: 2
    decimals: 1
    color: "darkgray"
    cell_color:
      1: "green!15"

  # Example multi-group tag: highlight full cell background in soft yellow
  top_performer:
    cell_color: "yellow!25"
    color: "ForestGreen"

default:
  decimals: 2
