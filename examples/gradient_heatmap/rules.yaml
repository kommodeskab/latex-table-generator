# Rule configuration showcasing per-column color gradients (heatmaps) across corruption benchmarks
groups:
  params:
    higher_is_better: false
    bold: 1
    si_prefix: true
    decimals: 1

  base_gradient:
    higher_is_better: true
    decimals: 1
    color_gradient: true
    colormap: "Blues"
    gradient_target: "cell"
    gradient_text_contrast: true

  # Each column has an independent gradient normalized to that column's min and max
  clean: "base_gradient"
  noise: "base_gradient"
  blur: "base_gradient"
  weather: "base_gradient"

  mce:
    higher_is_better: false
    bold: 1
    underline: 2
    decimals: 1

default:
  decimals: 1
